# Netlify configuration — The Business Loft (www.bizloftgy.com)
# Static site in /public, three small serverless functions in /netlify/functions.
# Secrets are NOT set here. Set them in Netlify: Site configuration → Environment variables.
# See README.md and .env.example for the list.

[build]
  publish = "public"
  command = "node scripts/check.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One canonical host: www.bizloftgy.com. Netlify redirects bizloftgy.com to it
# automatically once www is set as the primary domain (Domain management), and
# upgrades http:// to https:// before any rule here runs. Adding our own
# apex/www rules on top of that can create a redirect loop, so there are none.

# Friendly paths used in print and on social profiles.
[[redirects]]
  from = "/book"
  to = "/#book"
  status = 301

[[redirects]]
  from = "/plans"
  to = "/#plans"
  status = 301

[[redirects]]
  from = "/prices"
  to = "/#prices"
  status = 301

# security.txt must answer at the RFC 9116 path, /.well-known/security.txt.
# Netlify does not publish the dot-directory from `public/`, so the file is
# kept at public/security.txt and rewritten (status 200, not a redirect) so
# the canonical path serves it directly. Do NOT also add a 301 from
# /security.txt to the .well-known path: it would point at this rewrite and
# loop.
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 200

# ---------------------------------------------------------------------------
# Security headers for every response.
# CSP notes:
#  - No third-party scripts or styles. Meeting-room booking (OfficeRnD) and plan signup
#    (SphereMail) are on their own sites, reached by links.
#  - The only third-party frame is the Google Maps locator in "Find us" (storage.googleapis.com).
#  - Violations are reported to /api/csp-report and show up in the Netlify function log.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-src https://storage.googleapis.com; worker-src 'self'; media-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /api/csp-report"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), serial=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/forms/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"
