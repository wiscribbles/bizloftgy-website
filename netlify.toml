# Netlify configuration — The Business Loft (www.bizloftgy.com)
# Static site in /public, three small serverless functions in /netlify/functions.
# Secrets are NOT set here. Set them in Netlify: Site configuration → Environment variables.
# See README.md and .env.example for the list.

[build]
  publish = "public"
  command = "node scripts/check.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One canonical host: www.bizloftgy.com. Netlify redirects bizloftgy.com to it
# automatically once www is set as the primary domain (Domain management), and
# upgrades http:// to https:// before any rule here runs. Adding our own
# apex/www rules on top of that can create a redirect loop, so there are none.

# Friendly paths used in print and on social profiles.
[[redirects]]
  from = "/book"
  to = "/#book"
  status = 301

[[redirects]]
  from = "/plans"
  to = "/#plans"
  status = 301

[[redirects]]
  from = "/prices"
  to = "/#prices"
  status = 301

# security.txt must answer at the RFC 9116 path, /.well-known/security.txt.
# Netlify does not publish the dot-directory from `public/`, so the file is
# kept at public/security.txt and rewritten (status 200, not a redirect) so
# the canonical path serves it directly. Do NOT also add a 301 from
# /security.txt to the .well-known path: it would point at this rewrite and
# loop.
[[redirects]]
  from = "/.well-known/security.txt"
  to = "/security.txt"
  status = 200

# ---------------------------------------------------------------------------
# Security headers for every response.
# CSP notes:
#  - Meeting-room booking (OfficeRnD) and plan signup (SphereMail) are on their own
#    sites, reached by links.
#  - Analytics (Oct 2026): Google Tag Manager (GTM-PQ2P3THL) and the Meta Pixel.
#    Their two inline bootstrap snippets are allowed by SHA-256 hash, NOT by
#    'unsafe-inline' — so if either snippet is re-pasted or reformatted (even a
#    whitespace change), its hash changes and the script is silently blocked.
#    Recompute the hash and update it here if you touch those blocks.
#    Tags that GTM injects are only allowed from the hosts listed below; a new
#    third-party tag added in the GTM console will be blocked until its host is
#    added here. Blocks show up in the /api/csp-report function log.
#  - Third-party frames: the Google Maps locator in "Find us"
#    (storage.googleapis.com) and the GTM noscript iframe (googletagmanager.com).
#  - Violations are reported to /api/csp-report and show up in the Netlify function log.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-w5a3WajLqCDHQT8xugA4V3y8rfLzl5l4orN247ldEpc=' 'sha256-jXbBIhgiGFHVA7RptwqZyM79Fk0xeN1MLBgwGOKpOP8=' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://connect.facebook.net https://www.facebook.com; frame-src https://storage.googleapis.com https://www.googletagmanager.com; worker-src 'self'; media-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /api/csp-report"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), serial=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/forms/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"
